<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N0CALL Live — MMDVM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.3.5/mqtt.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsvectormap@1.6.0/dist/jsvectormap.min.css">
<script src="https://cdn.jsdelivr.net/npm/jsvectormap@1.6.0/dist/jsvectormap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsvectormap@1.6.0/dist/maps/world.js"></script>

<style>
:root{
  --bg:#0a0e14; --surface:#121821; --surface2:#1a2230; --border:#243040;
  --text:#e6edf3; --muted:#7d8da3; --accent:#00d4ff; --green:#00ff88;
  --red:#ff3860; --amber:#ffaa00; --purple:#a78bfa;
  --font-mono:'JetBrains Mono',monospace; --font-main:'Inter',-apple-system,'Segoe UI',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font-main);min-height:100vh;padding:20px}
.wrap{max-width:1100px;margin:0 auto}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.title{font-size:24px;font-weight:800}
.title span{color:var(--accent)}
.subtitle{font-size:13px;color:var(--muted);font-family:var(--font-mono)}
.conn{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--red);transition:all .3s}
.dot.on{background:var(--green);box-shadow:0 0 12px var(--green)}
.now{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:24px;text-align:center;transition:border-color .3s,box-shadow .3s;height:190px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.now.active{border-color:var(--green);box-shadow:0 0 30px rgba(0,255,136,.15)}
.now-label{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;font-family:var(--font-mono);margin-bottom:12px;flex:0 0 auto}
.now-idle{font-size:28px;font-weight:700;color:var(--muted)}
.now-tx{display:none}
.now-tx .who{font-size:36px;font-weight:800;color:var(--green);line-height:1.2;height:44px;display:flex;align-items:center;justify-content:center;gap:10px}
.now-tx .what{font-size:16px;color:var(--text);margin-top:8px;font-family:var(--font-mono)}
.now-tx .mode-badge{display:inline-block;margin-top:12px;padding:4px 14px;border-radius:20px;font-family:var(--font-mono);font-size:14px;font-weight:700;background:rgba(0,212,255,.12);color:var(--accent);border:1px solid var(--accent)}
.links{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.link-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
.link-card .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-family:var(--font-mono);margin-bottom:6px}
.link-card .val{font-size:18px;font-weight:700;font-family:var(--font-mono)}
.link-card .val.linked{color:var(--green)}
.link-card .val.unlinked{color:var(--muted)}
.section-title{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;font-family:var(--font-mono);margin-bottom:14px}
.feed{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow-y:auto;height:420px;box-sizing:border-box}
.event{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--border);font-family:var(--font-mono);font-size:14px;animation:slidein .3s ease}
.event:last-child{border-bottom:none}
@keyframes slidein{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.event .time{color:var(--muted);font-size:13px;min-width:70px}
.event .badge{padding:2px 10px;border-radius:6px;font-size:12px;font-weight:700;min-width:62px;text-align:center}
.badge.NXDN{background:rgba(255,170,0,.15);color:var(--amber)}
.badge.DMR{background:rgba(0,212,255,.15);color:var(--accent)}
.badge.YSF{background:rgba(167,139,250,.15);color:var(--purple)}
.badge.DStar,.badge.D-Star{background:rgba(0,255,136,.15);color:var(--green)}
.badge.LINK{background:rgba(125,141,163,.15);color:var(--muted)}
.event .txt{flex:1}
.event .txt b{color:var(--text)}
.event .src{font-size:12px;color:var(--muted)}
.event.start .txt b{color:var(--green)}
.empty{padding:40px;text-align:center;color:var(--muted);font-family:var(--font-mono);font-size:14px}
@media(max-width:600px){
  .links{grid-template-columns:repeat(2,1fr)}
  .title{font-size:20px}
  .now-tx .who{font-size:28px;height:36px}
  .feed{height:320px}
  .event{font-size:13px;gap:8px;padding:10px 12px}
}

/* --- карта активності --- */
.map-wrap{background:rgba(13,20,38,.72);border:1px solid rgba(80,120,190,.28);
  border-radius:14px;padding:14px 16px 10px;margin:14px 0}
.map-head{display:flex;align-items:baseline;justify-content:space-between;
  gap:12px;margin-bottom:10px;flex-wrap:wrap}
.map-title{color:#ffd75e;font-size:13px;letter-spacing:.16em;font-weight:600}
.map-stat{color:#5fd3ff;font-size:12px;
  font-family:ui-monospace,Menlo,Consolas,monospace}
#actmap{width:100%;height:300px}
#actmap{position:relative}
#actmap .jvm-zoom-btn{
  display:flex;align-items:center;justify-content:center;
  line-height:1 !important;font-size:13px;font-weight:700;
  background:rgba(30,45,75,.9);border:1px solid rgba(90,130,200,.35);
  color:#cfe3ff;border-radius:6px;
}
#actmap .jvm-zoom-btn.jvm-zoomin{top:auto !important;bottom:34px !important}
#actmap .jvm-zoom-btn.jvm-zoomout{top:auto !important;bottom:10px !important}
.jvm-tooltip{background:#101a30 !important;color:#e8f2ff !important;
  border:1px solid rgba(95,211,255,.45) !important;border-radius:8px !important;
  font-size:12px !important;padding:5px 9px !important}
.map-legend{display:flex;align-items:center;gap:7px;justify-content:flex-end;
  margin-top:6px;color:#7f96bb;font-size:11px}
.map-legend i{width:20px;height:9px;border-radius:2px;display:inline-block}
@media (max-width:600px){#actmap{height:210px}
  .map-title{font-size:11px;letter-spacing:.1em}}

/* --- перемикачі режимів над картою --- */
.map-modes{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.map-mode{
  background:rgba(24,36,60,.85);border:1px solid rgba(90,130,200,.3);
  color:#8fa8cc;border-radius:999px;padding:4px 13px;font-size:12px;
  font-family:inherit;cursor:pointer;transition:all .15s;
  -webkit-tap-highlight-color:transparent;
}
.map-mode:hover{border-color:rgba(95,211,255,.5);color:#cfe3ff}
.map-mode.on{
  background:#22c55e;border-color:#22c55e;color:#05140b;font-weight:600;
}
@media (max-width:600px){
  .map-mode{padding:3px 10px;font-size:11px}
}

body, .who, .what { font-family: inherit, 'Noto Color Emoji'; }
.who { font-family: 'JetBrains Mono', 'Noto Color Emoji', monospace !important; }
.tg-now{height:18px;line-height:18px;margin-top:4px;font-family:var(--font-mono);
  font-size:13px;color:var(--accent);opacity:0;transition:opacity .2s}
.tg-now.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div>
      <div class="title">N0CALL <span>LIVE</span></div>
      <div class="subtitle">MMDVM Hotspot · Real-time MQTT</div>
    </div>
    <div class="conn"><div class="dot" id="dot"></div><span id="connstat">З'єднання…</span></div>
  </div>

  <div class="now" id="now">
    <div class="now-label">Зараз в ефірі</div>
    <div class="now-idle" id="idle">— тиша —</div>
    <div class="now-tx" id="tx">
      <div class="who" id="tx-who">—</div>
      <div class="what" id="tx-what">—</div>
      <div class="mode-badge" id="tx-mode">—</div>
    </div>
  </div>

  <div class="links">
    <div class="link-card">
      <div class="lbl">DMR</div>
      <div class="val unlinked" id="dmr-link">—</div>
      <div class="tg-now" id="dmr-tg"></div>
    </div>
    <div class="link-card">
      <div class="lbl">D-Star</div>
      <div class="val unlinked" id="dstar-link">—</div>
    </div>
    <div class="link-card">
      <div class="lbl">YSF Gateway</div>
      <div class="val unlinked" id="ysf-link">—</div>
    </div>
    <div class="link-card">
      <div class="lbl">NXDN Gateway</div>
      <div class="val unlinked" id="nxdn-link">—</div>
    </div>
  </div>

  <div class="section-title">Останні події</div>
  <div class="map-wrap">
    <div class="map-head">
      <span class="map-title">ГЕОГРАФІЯ АКТИВНОСТІ (СЬОГОДНІ)</span>
      <span class="map-stat" id="map-stat">&#8212;</span>
    </div>
    <div class="map-modes" id="map-modes">
      <button class="map-mode on" data-mode="all">Всі</button>
      <button class="map-mode" data-mode="DMR">DMR</button>
      <button class="map-mode" data-mode="YSF">YSF</button>
      <button class="map-mode" data-mode="NXDN">NXDN</button>
      <button class="map-mode" data-mode="D-Star">D-Star</button>
    </div>
    <div id="actmap"></div>
    <div class="map-legend" id="map-legend"></div>
  </div>

  <div class="feed" id="feed">
    <div class="empty" id="empty">Очікування подій… Передайте з радіо або дочекайтесь активності мережі.</div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const host = location.hostname;
const proto = location.protocol === 'https:' ? 'wss' : 'ws';
const url = `${proto}://${location.host}/mqtt`;
let txTimer = null;

function setConn(ok){
  $('dot').className = 'dot' + (ok?' on':'');
  $('connstat').textContent = ok ? 'Підключено' : 'Відключено';
}

function now(){ return new Date().toLocaleTimeString('uk-UA',{hour12:false}); }

function pushEvent(mode, html, cls=''){
  const empty = $('empty'); if(empty) empty.remove();
  const feed = $('feed');
  const ev = document.createElement('div');
  ev.className = 'event ' + cls;
  const badgeCls = (mode||'LINK').replace('-','');
  ev.innerHTML = `<span class="time">${now()}</span><span class="badge ${badgeCls}">${mode||'LINK'}</span><span class="txt">${html}</span>`;
  feed.insertBefore(ev, feed.firstChild);
  while(feed.children.length > 30) feed.removeChild(feed.lastChild);
}

// Кеш DMR ID -> позивний. Live отримує дані з MQTT напряму, минаючи Flask,
// тому базу позивних доводиться питати окремим запитом.
// Оголошення має бути ДО першого використання (dmrIds у showTx).
window.__csCache = {};

// Підсвітка країни, з якої йде передача: червона під час TX,
// гасне одразу після її завершення.
window.__txIso = null;
var _txFadeTimer = null;

function mapHighlight(iso) {
  if (!iso) return;
  if (!window.__mapObj) {
    // Карта ще не готова (retained-стан приходить раніше) - запам'ятовуємо
    window.__pendingIso = iso;
    return;
  }
  clearTimeout(_txFadeTimer);
  if (window.__txIso && window.__txIso !== iso) mapRestore(window.__txIso);
  window.__txIso = iso;
  clearTimeout(_txFadeTimer);   // скидаємо таймер від попередньої передачі
  try {
    var a = {}; a[iso] = '#ff3860';
    window.__mapObj.series.regions[0].setAttributes(a);
  } catch(e) {}
}

function mapRestore(iso) {
  if (!iso || !window.__mapObj) return;
  try {
    var own = (window.__mapFills && window.__mapFills[iso]) || '#1b2740';
    var a = {}; a[iso] = own;
    window.__mapObj.series.regions[0].setAttributes(a);
  } catch(e) {}
}

function mapFadeOut() {
  // Гасимо одразу: підсвітка живе рівно стільки, скільки триває передача
  var iso = window.__txIso;
  if (!iso) return;
  clearTimeout(_txFadeTimer);
  mapRestore(iso);
  window.__txIso = null;
}

function showTx(mode, who, what){
  $('idle').style.display='none';
  $('tx').style.display='block';
  $('now').classList.add('active');
  $('tx-who').textContent = who;
  // Якщо в ефірі числовий DMR ID - підтягуємо позивний і замінюємо на льоту
  var _w = String(who || '').trim();
  if (/^\d+$/.test(_w)) {
    resolveCallsign(_w, $('tx-who'));   // підсвітку поставить сам resolve
  } else {
    var _iso = callsignToIso(_w);
    if (_iso) mapHighlight(_iso);
  }
  $('tx-what').textContent = what;
  $('tx-mode').textContent = mode;
  clearTimeout(txTimer);
  txTimer = setTimeout(clearTx, 300000);
}
function clearTx(){
  mapFadeOut();   // країна гасне через 5 с ПІСЛЯ завершення передачі
  var _tg=$('dmr-tg'); if(_tg) _tg.classList.remove('on');
  $('tx').style.display='none';
  $('idle').style.display='block';
  $('now').classList.remove('active');
}

function handleMmdvm(o){
  if(o.MMDVM || o.BER){ return; }
  for(const mode of ['NXDN','DMR','YSF','D-Star','DStar','P25']){
    if(o[mode]){
      const d = o[mode];
      const isDstar = (mode==='D-Star' || mode==='DStar');
      const nxdnIds = {};  // {'NXDN ID':'ПОЗИВНИЙ'}
      const dmrIds = window.__csCache;
      const who = d.src_callsign || (mode==='NXDN' ? (nxdnIds[String(d.src_id)] || d.src_info || d.src_id) : (mode==='DMR' ? (dmrIds[String(d.src_id)] || d.src_info || d.src_id) : (d.src_info || d.src_id))) || '?';
      // Фільтруємо службові TG
      if((mode==='NXDN' && String(d.dst_id)==='9999') || (mode==='NXDN' && String(d.src_id)==='9999')) return;
      let dst = '';
      if(isDstar){
        const tgt = d.reflector || d.dst_callsign || '';
        if(tgt && tgt!=='CQCQCQ') dst = ' → '+tgt.trim();
      } else if(mode==='YSF'){
        const tgt = d.reflector || '';
        if(tgt && tgt.trim()) dst = ' → '+tgt.trim();
      } else {
        if(d.dst_id!==undefined) dst = ' → TG '+d.dst_id;
      }
      const src = d.source==='rf' ? 'з радіо' : 'з мережі';
      if(d.action==='start' || d.action==='late_entry'){
        let cardId = null, cardVal = null;
        if(mode==='DMR' && d.dst_id!==undefined){
          var tgEl=$('dmr-tg');
          if(tgEl){ tgEl.textContent='TG '+d.dst_id; tgEl.classList.add('on'); }
        }
        else if(isDstar){ const r = d.reflector || d.dst_callsign || ''; if(r && r!=='CQCQCQ'){ cardId='dstar-link'; cardVal=r.trim(); } }
        if(cardId && cardVal){ const c=$(cardId); if(c){ c.textContent=cardVal; c.className='val linked'; } }
      }
      if(d.action==='start' || d.action==='late_entry'){
        lastWho[mode] = {who, dst};
        showTx(mode, who, dst.replace(' → ','') + ' · ' + src);
        pushEvent(mode, '<b>'+who+'</b>'+dst+' <span class="src">('+src+')</span>', 'start');
      } else if(d.action==='end'){
        clearTx();
        const dur = d.duration ? d.duration.toFixed(1)+'с' : '';
        const ber = d.ber !== undefined ? ' BER:'+(d.ber*100).toFixed(1)+'%' : '';
        const loss = d.loss !== undefined && d.loss!==0 ? ' Loss:'+d.loss+'%' : '';
        const prev = lastWho[mode] || {who:'?', dst:''};
        if(dur) pushEvent(mode, '<b>'+prev.who+'</b>'+prev.dst+' <span class="src">'+dur+ber+loss+'</span>', 'end');
      }
      return;
    }
  }
}

const lastLink = {};
const lastWho = {}; // зберігаємо позивний між start і end
const unlinkTimers = {};
function handleLink(gw, o){
  if(!o.link) return;
  const a = o.link.action;
  const tg = o.link.talkgroup!==undefined ? o.link.talkgroup : '';
  const refl = o.link.reflector ? o.link.reflector.trim() : '';
  const el = $(gw+'-link');
  const target = tg!=='' ? ('TG '+tg) : (refl || 'linked');
  if(a==='linking' || a==='linked'){
    clearTimeout(unlinkTimers[gw]);
    el.textContent = target;
    el.className = 'val linked';
    if(lastLink[gw] !== target){
      // pushEvent('LINK', gw.toUpperCase()+' → '+target); // прибрано - тільки голосові
      lastLink[gw] = target;
    }
  } else if(a==='unlinked'){
    const prev = lastLink[gw];
    clearTimeout(unlinkTimers[gw]);
    unlinkTimers[gw] = setTimeout(function(){
      el.textContent = '— не підключено —';
      el.className = 'val unlinked';
      // if(prev){ pushEvent('LINK', gw.toUpperCase()+' відключено'); } // прибрано
      lastLink[gw] = null;
    }, 4000);
  }
}

// Ініціалізуємо лінки з API
fetch('http://'+location.hostname+':85/api/network_status').then(r=>r.json()).then(d=>{
  if(d.dstar_linked && d.dstar_linked!='--'){
    const el=$('dstar-link');
    el.textContent=d.dstar_linked;
    el.className='val '+(d.dstar_linked=='Не підключено'?'unlinked':'linked');
  }
  if(d.dmr_master && d.dmr_master!='--'){
    const el=$('dmr-link');
    el.textContent=d.dmr_master;
    el.className='val linked';
  }
  if(d.ysf_linked && d.ysf_linked!='--'){
    const el=$('ysf-link');
    el.textContent=d.ysf_linked;
    el.className='val '+(d.ysf_linked=='Не підключено'?'unlinked':'linked');
  }
  if(d.nxdn_linked && d.nxdn_linked!='--'){
    const el=$('nxdn-link');
    el.textContent=d.nxdn_linked;
    el.className='val '+(d.nxdn_linked=='Не підключено'?'unlinked':'linked');
  }
}).catch(()=>{});

const client = mqtt.connect(url, {reconnectPeriod:3000});
client.on('connect', ()=>{ setConn(true); client.subscribe('#'); });

// SSE для оновлення network статусу в реальному часі
// Позивний -> ISO країни через бекенд (YSF/NXDN/D-Star приходять без прапорця).
// Викликає mapHighlight асинхронно, коли відповідь надійде.
window.__isoCache = {};
function callsignToIso(cs) {
  cs = String(cs || '').split('/')[0].split(' ')[0].trim().toUpperCase();
  if (!cs || cs.length < 2) return null;
  var hit = window.__isoCache[cs];
  if (hit !== undefined) return hit || null;
  window.__isoCache[cs] = null;
  fetch('http://' + location.hostname + ':85/api/callsign/' + encodeURIComponent(cs))
    .then(function(r){ return r.json(); })
    .then(function(d){
      var rec = d && d[cs];
      var iso = (rec && rec.flag && window.flagToIso) ? window.flagToIso(rec.flag) : null;
      window.__isoCache[cs] = iso || '';
      if (iso) mapHighlight(iso);
    })
    .catch(function(){ delete window.__isoCache[cs]; });
  return null;
}

function resolveCallsign(id, el) {
  id = String(id || '').trim();
  if (!id || !/^\d+$/.test(id)) return;
  var hit = window.__csCache[id];
  if (hit) {                       // вже знаємо - підставляємо негайно
    if (el && el.textContent.trim() === id) {
      var f = (window.__flagCache && window.__flagCache[id]) || '';
      el.textContent = (f ? f + ' ' : '') + hit;
    }
    return;
  }
  if (hit !== undefined) return;   // null = запит уже в дорозі
  window.__csCache[id] = null;  // мітка "вже запитано"
  fetch('http://' + location.hostname + ':85/api/callsign/' + id)
    .then(function(r){ return r.json(); })
    .then(function(d){
      var rec = d && d[id];
      var cs = rec && rec.callsign;
      window.__csCache[id] = cs || '';
      window.__flagCache = window.__flagCache || {};
      if (rec && rec.flag) window.__flagCache[id] = rec.flag;
      // Якщо цей ID досі в ефірі - оновлюємо напис на льоту
      if (cs && el && el.textContent.trim() === id) {
        var fl = (rec && rec.flag) ? rec.flag + ' ' : '';
        el.textContent = fl + cs;
      }
      if (rec && rec.flag) {
        var iso2 = window.flagToIso ? window.flagToIso(rec.flag) : null;
        if (iso2) mapHighlight(iso2);
      }
    })
    .catch(function(){ delete window.__csCache[id]; });
}

const sse = new EventSource('http://'+location.hostname+':85/api/stream');
sse.onmessage = function(e){
  try{
    const d = JSON.parse(e.data);
    if(!d.network) return;
    const n = d.network;
    const fields = [
      ['dstar-link', n.dstar_linked],
      ['dmr-link', n.dmr_master],
      ['ysf-link', n.ysf_linked],
      ['nxdn-link', n.nxdn_linked]
    ];
    fields.forEach(([id, val])=>{
      if(!val || val==='--') return;
      const el=$(id); if(!el) return;
      el.textContent = val;
      el.className = 'val '+(val==='Не підключено'?'unlinked':'linked');
    });
  }catch(e){}
};
client.on('reconnect', ()=> setConn(false));
client.on('close', ()=> setConn(false));
client.on('error', ()=> setConn(false));
function handleState(st){
  // Retained-стан при завантаженні: показати активність, якщо вона є зараз
  if(st && st.active){
    showTx(st.mode || '', st.who || '?', (st.dst ? st.dst : '') + (st.src ? ' \u00b7 ' + st.src : ''));
  }
}
client.on('message', (topic, payload)=>{
  let o; try{ o = JSON.parse(payload.toString()); }catch(e){ return; }
  if(topic==='mmdvm/state'){ handleState(o); }
  else if(topic==='mmdvm/json') handleMmdvm(o);
  else if(topic==='ysf-gateway/json') handleLink('ysf', o);
  else if(topic==='nxdn-gateway/json') handleLink('nxdn', o);
});
</script>
<script>
(function(){
  var mapObj=null, mapReady=false;

  // Карта тягне добу окремо: SSE віддає лише зріз останніх подій
  var mapMode='all';

  window.setMapMode=function(m, btn){
    mapMode=m;
    var bs=document.querySelectorAll('#map-modes .map-mode');
    for(var i=0;i<bs.length;i++) bs[i].classList.remove('on');
    if(btn) btn.classList.add('on');
    loadMapData();
  };

  var _mapReq=0;
  function loadMapData(){
    var q='http://'+location.hostname+':85/api/activity?limit=10000';
    var mode=mapMode;
    if(mode!=='all') q+='&mode='+encodeURIComponent(mode);
    var myReq=++_mapReq;
    fetch(q)
      .then(function(r){ return r.json(); })
      .then(function(d){
        // Відповідь застаріла (режим уже змінили) - ігноруємо
        if(myReq!==_mapReq || mode!==mapMode) return;
        if(d && window.updateActivityMap)
          updateActivityMap(d.activity||[]);
      })
      .catch(function(){});
  }
  setTimeout(loadMapData, 800);
  setInterval(loadMapData, 120000);

  // Емодзі-прапорець -> ISO-2 (регіональні індикатори: U+1F1E6 = "A")
  window.flagToIso = flagToIso;   // потрібна поза замиканням карти
  function flagToIso(flag){
    if(!flag) return null;
    var cp=Array.from(flag).map(function(c){return c.codePointAt(0);});
    if(cp.length<2) return null;
    var a=cp[0]-0x1F1E6, b=cp[1]-0x1F1E6;
    if(a<0||a>25||b<0||b>25) return null;
    return String.fromCharCode(65+a)+String.fromCharCode(65+b);
  }

  function initMap(){
    if(mapReady) return true;
    if(typeof jsVectorMap==='undefined') return false;
    try{
      mapObj=new jsVectorMap({
        selector:'#actmap', map:'world',
        backgroundColor:'transparent', zoomButtons:true,
        regionStyle:{
          initial:{fill:'#1b2740', stroke:'#0c1428', strokeWidth:0.4},
          hover:{fill:'#ffd75e'}
        },
        series:{regions:[{attribute:'fill',
          scale:['#14532d','#1e6f4c','#25c07a','#4ade80','#7dffc4'],
          normalizeFunction:'linear', values:{}}]},
        onRegionTooltipShow:function(ev,tooltip,code){
          var n=(window.__mapCounts&&window.__mapCounts[code])||0;
          if(!n) return;
          var n10=n%10, n100=n%100, w;
          if(n10===1 && n100!==11) w='\u043f\u0435\u0440\u0435\u0434\u0430\u0447\u0430';
          else if(n10>=2 && n10<=4 && (n100<12||n100>14)) w='\u043f\u0435\u0440\u0435\u0434\u0430\u0447\u0456';
          else w='\u043f\u0435\u0440\u0435\u0434\u0430\u0447';
          tooltip.text(tooltip.text()+' \u2014 '+n+' '+w);
        }
      });
      mapReady=true;
      window.__mapObj = mapObj;   // потрібен для підсвітки країни в ефірі
      if (window.__pendingIso) {   // передача вже йшла, коли сторінку відкрили
        var pi = window.__pendingIso; window.__pendingIso = null;
        setTimeout(function(){ mapHighlight(pi); }, 100);
      }
      return true;
    }catch(e){ console.error('map init:',e); return false; }
  }

  window.updateActivityMap=function(activity){
    if(!initMap()) return;
    activity = activity || [];
    if(!activity.length){
      // Порожня вибірка: гасимо карту, інакше лишиться попередній режим
      window.__mapCounts={};
      try{
        var clr={};
        for(var rc in mapObj.regions){ clr[rc]='#1b2740'; }
        mapObj.series.regions[0].setAttributes(clr);
      }catch(e){}
      var st0=document.getElementById('map-stat');
      if(st0) st0.textContent='\u043d\u0435\u043c\u0430\u0454 \u0434\u0430\u043d\u0438\u0445';
      return;
    }
    var counts={}, total=0, calls={};
    for(var i=0;i<activity.length;i++){
      var e=activity[i], iso=flagToIso(e.flag);
      if(!iso) continue;
      counts[iso]=(counts[iso]||0)+1; total++;
      var cs=(e.callsign||'').split('/')[0].split(' ')[0].trim();
      if(cs){ calls[iso]=calls[iso]||{}; calls[iso][cs]=1; }
    }
    window.__mapCounts=counts;
    // Лог-шкала: розкид 1..1000+ інакше робить усе темним, крім лідера
    // Кольори рахуємо самі: логарифмічна шкала -> fill напряму.
    // Механіка scale в бібліотеці залежить від версії, setAttributes - ні.
    var mx=0;
    for(var c in counts){ if(counts[c]>mx) mx=counts[c]; }
    var lmax=Math.log(mx+1)||1;
    var stops=[[20,83,45],[34,197,94],[134,239,172],[217,255,240]];
    function pick(t){
      if(t<0) t=0; if(t>1) t=1;
      var x=t*(stops.length-1), i=Math.floor(x), f=x-i;
      if(i>=stops.length-1) return stops[stops.length-1];
      var a=stops[i], b=stops[i+1];
      return [Math.round(a[0]+(b[0]-a[0])*f),
              Math.round(a[1]+(b[1]-a[1])*f),
              Math.round(a[2]+(b[2]-a[2])*f)];
    }
    var fills={};
    for(var c2 in counts){
      var rgb=pick(Math.log(counts[c2]+1)/lmax);
      fills[c2]='rgb('+rgb[0]+','+rgb[1]+','+rgb[2]+')';
    }
    try{
      // Спершу гасимо ВСІ країни: setAttributes не чіпає ті, яких немає
      // у fills, тому без цього кольори попереднього режиму лишаються
      var reset={};
      for(var rc in mapObj.regions){ reset[rc]='#1b2740'; }
      mapObj.series.regions[0].setAttributes(reset);
      mapObj.series.regions[0].setAttributes(fills);
      window.__mapFills = fills;  // власні кольори країн для відновлення
      // Якщо країна зараз в ефірі - повертаємо їй червоний після перемальовки
      if (window.__txIso) {
        var keep={}; keep[window.__txIso]='#ff3860';
        mapObj.series.regions[0].setAttributes(keep);
      }
    }catch(err){ console.error('setAttributes:', err); }
    var nc=Object.keys(counts).length, ops=0;
    for(var k in calls){ ops+=Object.keys(calls[k]).length; }
    function plural(n, one, few, many){
      var a=n%10, b=n%100;
      if(a===1 && b!==11) return one;
      if(a>=2 && a<=4 && (b<12||b>14)) return few;
      return many;
    }
    var st=document.getElementById('map-stat');
    if(st) st.textContent =
      nc+' '+plural(nc,'\u043a\u0440\u0430\u0457\u043d\u0430','\u043a\u0440\u0430\u0457\u043d\u0438','\u043a\u0440\u0430\u0457\u043d')+' \u00b7 '
      +ops+' '+plural(ops,'\u043f\u043e\u0437\u0438\u0432\u043d\u0438\u0439','\u043f\u043e\u0437\u0438\u0432\u043d\u0456','\u043f\u043e\u0437\u0438\u0432\u043d\u0438\u0445')+' \u00b7 '
      +total+' '+plural(total,'\u043f\u0435\u0440\u0435\u0434\u0430\u0447\u0430','\u043f\u0435\u0440\u0435\u0434\u0430\u0447\u0456','\u043f\u0435\u0440\u0435\u0434\u0430\u0447');
    var lg=document.getElementById('map-legend');
    if(lg&&!lg.dataset.done){
      lg.innerHTML='<span>\u043c\u0435\u043d\u0448\u0435</span>'
        +'<i style="background:#1e6f4c"></i><i style="background:#25c07a"></i>'
        +'<i style="background:#7dffc4"></i>'
        +'<span>\u0431\u0456\u043b\u044c\u0448\u0435</span>';
      lg.dataset.done='1';
    }
  };
})();
</script>

<script>
(function(){
  var box=document.getElementById('map-modes');
  if(!box) return;
  box.addEventListener('click', function(ev){
    var b=ev.target.closest('.map-mode');
    if(b && window.setMapMode) setMapMode(b.dataset.mode, b);
  });
})();
</script>
